# Why: every push and pull request proves the package still passes the strict validator and the directory review checks.
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Claude Code CLI (validator only, no sign-in)
        run: npm install -g @anthropic-ai/claude-code@latest
      - name: Validate
        run: scripts/validate.sh
